name: Release RC (TestPyPI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish and verify (for example: 1.0.1rc1)"
        required: true
        type: string

jobs:
  build-artifacts:
    name: Build RC artifacts
    runs-on: ubuntu-24.04
    env:
      UV_LINK_MODE: copy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Set version from workflow input
        run: |
          sed -i "s/^version = .*/version = \"${{ github.event.inputs.version }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Build sdist
        run: python -m build --sdist

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*

  verify-macos-wheel-linkage:
    name: Verify macOS wheel linkage
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: brew install cmake ninja ffmpeg libsoxr

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build

      - name: Set version from workflow input
        run: |
          sed -i '' "s/^version = .*/version = \"${{ github.event.inputs.version }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel linkage and notice files
        run: python tools/check_wheel_linkage.py dist/*.whl

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-24.04
    needs: [build-artifacts, verify-macos-wheel-linkage]
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  smoke-linux-x86_64:
    name: Smoke install from TestPyPI (Linux x86_64)
    runs-on: ubuntu-24.04
    needs: [publish-testpypi]
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
      MLX_DEVICE: cpu
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Install from TestPyPI
        run: |
          python -m pip install --upgrade pip
          for i in {1..12}; do
            python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              --pre "mlx-audio-io==${PACKAGE_VERSION}" && break
            if [ "$i" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Smoke test
        run: |
          python -c "import os, tempfile; import mlx.core as mx; import mlx_audio_io as aio; x = mx.zeros((512, 1), dtype=mx.float32); fd, p = tempfile.mkstemp(suffix='.wav'); os.close(fd); aio.save(p, x, 16000); y, sr = aio.load(p); meta = aio.info(p); chunks = list(aio.stream(p, chunk_frames=128)); assert sr == 16000; assert meta.sample_rate == 16000; assert y.shape[1] == 1; assert len(chunks) > 0; os.unlink(p)"

  smoke-linux-arm64:
    name: Smoke install from TestPyPI (Linux arm64)
    runs-on: ubuntu-24.04-arm
    needs: [publish-testpypi]
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
      MLX_DEVICE: cpu
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Install from TestPyPI
        run: |
          python -m pip install --upgrade pip
          for i in {1..12}; do
            python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              --pre "mlx-audio-io==${PACKAGE_VERSION}" && break
            if [ "$i" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Smoke test
        run: |
          python -c "import os, tempfile; import mlx.core as mx; import mlx_audio_io as aio; x = mx.zeros((512, 1), dtype=mx.float32); fd, p = tempfile.mkstemp(suffix='.wav'); os.close(fd); aio.save(p, x, 16000); y, sr = aio.load(p); meta = aio.info(p); chunks = list(aio.stream(p, chunk_frames=128)); assert sr == 16000; assert meta.sample_rate == 16000; assert y.shape[1] == 1; assert len(chunks) > 0; os.unlink(p)"

  smoke-macos:
    name: Smoke install from TestPyPI (macOS)
    runs-on: macos-14
    needs: [publish-testpypi]
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
      MLX_DEVICE: cpu
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build and runtime dependencies
        run: brew install cmake ninja ffmpeg

      - name: Install from TestPyPI
        run: |
          python -m pip install --upgrade pip
          for i in {1..12}; do
            python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              --pre "mlx-audio-io==${PACKAGE_VERSION}" && break
            if [ "$i" -eq 12 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Smoke test
        run: |
          python -c "import os, tempfile; import mlx.core as mx; import mlx_audio_io as aio; x = mx.zeros((512, 1), dtype=mx.float32); fd, p = tempfile.mkstemp(suffix='.wav'); os.close(fd); aio.save(p, x, 16000); y, sr = aio.load(p); meta = aio.info(p); chunks = list(aio.stream(p, chunk_frames=128)); assert sr == 16000; assert meta.sample_rate == 16000; assert y.shape[1] == 1; assert len(chunks) > 0; os.unlink(p)"
