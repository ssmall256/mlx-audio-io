name: Release (PyPI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example: 1.0.0)"
        required: true
        type: string

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Set version from workflow input
        run: |
          sed -i "s/^version = .*/version = \"${{ github.event.inputs.version }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Build sdist
        run: python -m build --sdist

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*

  verify-macos-wheel-linkage:
    name: Verify macOS wheel linkage
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: brew install cmake ninja ffmpeg libsoxr

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build

      - name: Set version from workflow input
        run: |
          sed -i '' "s/^version = .*/version = \"${{ github.event.inputs.version }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel linkage and notice files
        run: python tools/check_wheel_linkage.py dist/*.whl

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [build-artifacts, verify-macos-wheel-linkage]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  smoke-linux-x86_64:
    name: Smoke install from PyPI (Linux x86_64)
    runs-on: ubuntu-24.04
    needs: [publish-pypi]
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
      MLX_DEVICE: cpu
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Wait for mlx-audio-io on PyPI
        run: |
          # Poll the index rather than `pip download`. mlx-audio-io ships an
          # sdist, and asking pip to download it prepares metadata, which runs
          # the build backend and compiles the extension -- so the wait itself
          # would cost a full build and the install would then compile again.
          # Up to 10 minutes: a freshly published file can take minutes to
          # reach every CDN mirror, and macOS runners hit stale ones often.
          for attempt in {1..60}; do
            if curl -fsSL "https://pypi.org/simple/mlx-audio-io/" | grep -q "mlx_audio_io-${PACKAGE_VERSION}.tar.gz"; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "mlx-audio-io ${PACKAGE_VERSION} did not reach PyPI within 10 minutes" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Install from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir \
            "mlx-audio-io==${PACKAGE_VERSION}"

      - name: Smoke test
        run: |
          python -c "import os, tempfile; import mlx.core as mx; import mlx_audio_io as aio; x = mx.zeros((512, 1), dtype=mx.float32); fd, p = tempfile.mkstemp(suffix='.wav'); os.close(fd); aio.save(p, x, 16000); y, sr = aio.load(p); meta = aio.info(p); chunks = list(aio.stream(p, chunk_frames=128)); assert sr == 16000; assert meta.sample_rate == 16000; assert y.shape[1] == 1; assert len(chunks) > 0; os.unlink(p)"

  smoke-linux-arm64:
    name: Smoke install from PyPI (Linux arm64)
    runs-on: ubuntu-24.04-arm
    needs: [publish-pypi]
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
      MLX_DEVICE: cpu
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Wait for mlx-audio-io on PyPI
        run: |
          # Poll the index rather than `pip download`. mlx-audio-io ships an
          # sdist, and asking pip to download it prepares metadata, which runs
          # the build backend and compiles the extension -- so the wait itself
          # would cost a full build and the install would then compile again.
          # Up to 10 minutes: a freshly published file can take minutes to
          # reach every CDN mirror, and macOS runners hit stale ones often.
          for attempt in {1..60}; do
            if curl -fsSL "https://pypi.org/simple/mlx-audio-io/" | grep -q "mlx_audio_io-${PACKAGE_VERSION}.tar.gz"; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "mlx-audio-io ${PACKAGE_VERSION} did not reach PyPI within 10 minutes" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Install from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir \
            "mlx-audio-io==${PACKAGE_VERSION}"

      - name: Smoke test
        run: |
          python -c "import os, tempfile; import mlx.core as mx; import mlx_audio_io as aio; x = mx.zeros((512, 1), dtype=mx.float32); fd, p = tempfile.mkstemp(suffix='.wav'); os.close(fd); aio.save(p, x, 16000); y, sr = aio.load(p); meta = aio.info(p); chunks = list(aio.stream(p, chunk_frames=128)); assert sr == 16000; assert meta.sample_rate == 16000; assert y.shape[1] == 1; assert len(chunks) > 0; os.unlink(p)"

  smoke-macos:
    name: Smoke install from PyPI (macOS)
    runs-on: macos-14
    needs: [publish-pypi]
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
      MLX_DEVICE: cpu
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build and runtime dependencies
        run: brew install cmake ninja ffmpeg

      - name: Wait for mlx-audio-io on PyPI
        run: |
          # Poll the index rather than `pip download`. mlx-audio-io ships an
          # sdist, and asking pip to download it prepares metadata, which runs
          # the build backend and compiles the extension -- so the wait itself
          # would cost a full build and the install would then compile again.
          # Up to 10 minutes: a freshly published file can take minutes to
          # reach every CDN mirror, and macOS runners hit stale ones often.
          for attempt in {1..60}; do
            if curl -fsSL "https://pypi.org/simple/mlx-audio-io/" | grep -q "mlx_audio_io-${PACKAGE_VERSION}.tar.gz"; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "mlx-audio-io ${PACKAGE_VERSION} did not reach PyPI within 10 minutes" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Install from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir \
            "mlx-audio-io==${PACKAGE_VERSION}"

      - name: Smoke test
        run: |
          python -c "import os, tempfile; import mlx.core as mx; import mlx_audio_io as aio; x = mx.zeros((512, 1), dtype=mx.float32); fd, p = tempfile.mkstemp(suffix='.wav'); os.close(fd); aio.save(p, x, 16000); y, sr = aio.load(p); meta = aio.info(p); chunks = list(aio.stream(p, chunk_frames=128)); assert sr == 16000; assert meta.sample_rate == 16000; assert y.shape[1] == 1; assert len(chunks) > 0; os.unlink(p)"
