name: Release (PyPI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example: 1.0.0)"
        required: true
        type: string

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Set version from workflow input
        run: |
          sed -i "s/^version = .*/version = \"${{ github.event.inputs.version }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Build sdist
        run: python -m build --sdist

      - name: Validate metadata
        run: python -m twine check dist/*

      - name: Validate built version
        env:
          PACKAGE_VERSION: ${{ github.event.inputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          expected = Version(os.environ["PACKAGE_VERSION"])
          built = set()
          for dist in sorted(Path("dist").iterdir()):
              if dist.name.endswith(".whl"):
                  built.add(parse_wheel_filename(dist.name)[1])
              elif dist.name.endswith(".tar.gz"):
                  built.add(parse_sdist_filename(dist.name)[1])
          if not built:
              raise SystemExit("No distributions were built")
          if built != {expected}:
              raise SystemExit(
                  f"Requested {expected}, but built {sorted(str(v) for v in built)}"
              )
          print(f"Validated built version {expected}")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/*

  verify-macos-wheel-linkage:
    name: Verify macOS wheel linkage
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: brew install cmake ninja ffmpeg libsoxr

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build

      - name: Set version from workflow input
        run: |
          sed -i '' "s/^version = .*/version = \"${{ github.event.inputs.version }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel linkage and notice files
        run: python tools/check_wheel_linkage.py dist/*.whl

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [build-artifacts, verify-macos-wheel-linkage]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: true

  smoke-linux-x86_64:
    name: Smoke install from PyPI (Linux x86_64)
    runs-on: ubuntu-24.04
    needs: [publish-pypi]
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
      MLX_DEVICE: cpu
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev

      - name: Resolve the published mlx-audio-io artifact
        run: |
          # pip resolves against the PEP 691 JSON rendering of
          # /simple/<project>/. That rendering is cached separately from the
          # PEP 503 HTML one and the two can serve different snapshots of the
          # same URL, so a freshly published version may be invisible to pip
          # while every other view of PyPI already shows it. Ask the release
          # API for the file directly, which sits outside that split, and
          # install the artifact by URL.
          python - <<'PY' >> "${GITHUB_ENV}"
          import json
          import os
          import time
          import urllib.request

          name = "mlx-audio-io"
          version = os.environ["PACKAGE_VERSION"]
          api = f"https://pypi.org/pypi/{name}/{version}/json"

          for _ in range(60):
              try:
                  with urllib.request.urlopen(api, timeout=30) as response:
                      files = json.load(response)["urls"]
              except Exception:
                  files = []
              for kind in ("bdist_wheel", "sdist"):
                  for entry in files:
                      if entry["packagetype"] == kind:
                          print(f"ARTIFACT_URL={entry['url']}")
                          raise SystemExit(0)
              time.sleep(10)

          raise SystemExit(
              f"{name} {version} did not reach PyPI within 10 minutes"
          )
          PY

      - name: Install mlx-audio-io from the resolved artifact
        run: |
          python -m pip install --upgrade pip
          # The artifact URL is exact, but dependencies still resolve through
          # the index, so retry: a freshly published dependency can be missing
          # from the mirror pip reads. A resolution failure costs nothing.
          for attempt in {1..8}; do
            if python -m pip install --no-cache-dir \
              "${ARTIFACT_URL}"; then
              break
            fi
            if [ "${attempt}" -eq 8 ]; then
              echo "Could not install ${ARTIFACT_URL}" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Smoke test
        run: |
          python -c "import os, tempfile; import mlx.core as mx; import mlx_audio_io as aio; x = mx.zeros((512, 1), dtype=mx.float32); fd, p = tempfile.mkstemp(suffix='.wav'); os.close(fd); aio.save(p, x, 16000); y, sr = aio.load(p); meta = aio.info(p); chunks = list(aio.stream(p, chunk_frames=128)); assert sr == 16000; assert meta.sample_rate == 16000; assert y.shape[1] == 1; assert len(chunks) > 0; os.unlink(p)"

  smoke-linux-arm64:
    name: Smoke install from PyPI (Linux arm64)
    runs-on: ubuntu-24.04-arm
    needs: [publish-pypi]
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version }}
