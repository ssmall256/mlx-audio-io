[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.12.0,<2.16",
    "mlx>=0.31.2,<0.33; platform_system == 'Darwin'",
    "mlx[cpu]>=0.31.2,<0.33; platform_system == 'Linux'",
    "delocate>=0.11; platform_system == 'Darwin'",
    "auditwheel>=6.2; platform_system == 'Linux'",
]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "mlx-audio-io"
version = "1.3.16"
description = "Native audio I/O for MLX on macOS and Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.31.2,<0.33; platform_system == 'Darwin'",
    "mlx[cpu]>=0.31.2,<0.33; platform_system == 'Linux'",
]

[project.urls]
Repository = "https://github.com/ssmall256/mlx-audio-io"
Issues = "https://github.com/ssmall256/mlx-audio-io/issues"

[project.optional-dependencies]
dev = ["pytest>=9.0.2", "numpy"]
benchmark = [
    "librosa",
    "soundfile",
    "numpy",
    "psutil",
    "torch",
    "torchaudio",
    "torchcodec; platform_system != 'Linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64')",
]

[tool.scikit-build]
wheel.packages = ["python/mlx_audio_io"]
build-dir = "build/{wheel_tag}"
editable.verbose = false
sdist.include = [
    "python/mlx_audio_io/THIRD_PARTY_NOTICES.md",
    "python/mlx_audio_io/licenses/libsoxr/**",
    "tools/check_wheel_linkage.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_build_pairing.py imports build_backend, which lives at the repo
# root rather than in the installed package. Without this it imports only when
# something else happens to put the root on sys.path -- which stopped being
# true once the project was installed non-editable, and took CI red with
# "ModuleNotFoundError: No module named 'build_backend'".
pythonpath = ["."]
markers = [
    "apple_only: Requires the macOS AudioToolbox backend",
    "linux_mvp: Covered by Linux backend support matrix",
]
